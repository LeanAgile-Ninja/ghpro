<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR – Tempo Dostarczania Dzienne (XmR)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a2940;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      min-width: 130px;
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a2940;
    }
    .stat-card .unit {
      font-size: 0.8rem;
      color: #888;
      margin-left: 3px;
    }
    .chart-card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .chart-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a2940;
    }
    .chart-container {
      position: relative;
      height: 360px;
    }
    .legend-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #555;
    }
    .legend-dot {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <h1>DR – Tempo Dostarczania Dzienne (XmR)</h1>
  <p class="subtitle">Dane posortowane według daty, źródło: 4. Tempo dostarczania dzienne.csv</p>

  <div class="stats-row" id="statsRow"></div>

  <div class="chart-card">
    <h2>Wykres przebiegu (X)</h2>
    <div class="chart-container">
      <canvas id="runChart"></canvas>
    </div>
    <div class="legend-row">
      <div class="legend-item">
        <div class="legend-dot" style="background:#3b82f6;"></div>
        Przepustowość
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-top: 2px dashed #f59e0b; background:transparent;"></div>
        Mediana
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#10b981;"></div>
        Średnia (X̄)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-top: 2px dashed #ef4444; background:transparent;"></div>
        UNPL / LNPL
      </div>
    </div>
  </div>

  <div class="chart-card">
    <h2>Wykres zakresów kroczących (MR)</h2>
    <div class="chart-container">
      <canvas id="mrChart"></canvas>
    </div>
    <div class="legend-row">
      <div class="legend-item">
        <div class="legend-dot" style="background:#8b5cf6;"></div>
        Zakres kroczący (MR)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#10b981;"></div>
        Średnia MR̄
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-top: 2px dashed #ef4444; background:transparent;"></div>
        URL (3,27 × MR̄)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="border-top: 2px dashed #f59e0b; background:transparent;"></div>
        LRL = 0
      </div>
    </div>
  </div>

<script>
  const raw = [
    {date:"07.01.2025", v:0},
    {date:"08.01.2025", v:2},
    {date:"09.01.2025", v:10},
    {date:"10.01.2025", v:3},
    {date:"11.01.2025", v:0},
    {date:"12.01.2025", v:0},
    {date:"13.01.2025", v:2},
    {date:"14.01.2025", v:3},
    {date:"15.01.2025", v:7},
    {date:"16.01.2025", v:0},
    {date:"17.01.2025", v:0},
    {date:"18.01.2025", v:0},
    {date:"19.01.2025", v:0},
    {date:"20.01.2025", v:5},
    {date:"21.01.2025", v:2},
    {date:"22.01.2025", v:0},
    {date:"23.01.2025", v:0},
    {date:"24.01.2025", v:0},
    {date:"25.01.2025", v:0},
    {date:"26.01.2025", v:0},
    {date:"27.01.2025", v:1},
    {date:"28.01.2025", v:1},
    {date:"29.01.2025", v:0},
    {date:"30.01.2025", v:5},
    {date:"31.01.2025", v:4},
    {date:"01.02.2025", v:0},
    {date:"02.02.2025", v:0},
    {date:"03.02.2025", v:7},
    {date:"04.02.2025", v:0},
    {date:"05.02.2025", v:2},
    {date:"06.02.2025", v:2},
    {date:"07.02.2025", v:12},
    {date:"08.02.2025", v:0},
    {date:"09.02.2025", v:0},
    {date:"10.02.2025", v:1},
    {date:"11.02.2025", v:0},
    {date:"12.02.2025", v:0},
    {date:"13.02.2025", v:2},
    {date:"14.02.2025", v:12},
    {date:"15.02.2025", v:0},
    {date:"16.02.2025", v:0},
    {date:"17.02.2025", v:1},
    {date:"18.02.2025", v:0},
    {date:"19.02.2025", v:0},
    {date:"20.02.2025", v:3},
    {date:"21.02.2025", v:11},
    {date:"22.02.2025", v:0},
    {date:"23.02.2025", v:0},
    {date:"24.02.2025", v:6},
    {date:"25.02.2025", v:0},
    {date:"26.02.2025", v:0},
    {date:"27.02.2025", v:6},
    {date:"28.02.2025", v:7},
    {date:"01.03.2025", v:0},
    {date:"02.03.2025", v:0},
    {date:"03.03.2025", v:2},
    {date:"04.03.2025", v:0},
    {date:"05.03.2025", v:0},
    {date:"06.03.2025", v:3},
    {date:"07.03.2025", v:5},
    {date:"08.03.2025", v:0},
    {date:"09.03.2025", v:0},
    {date:"10.03.2025", v:1},
    {date:"11.03.2025", v:0},
    {date:"12.03.2025", v:0},
    {date:"13.03.2025", v:9},
    {date:"14.03.2025", v:7},
    {date:"15.03.2025", v:0},
    {date:"16.03.2025", v:0},
    {date:"17.03.2025", v:3},
    {date:"18.03.2025", v:0},
    {date:"19.03.2025", v:0},
    {date:"20.03.2025", v:4},
    {date:"21.03.2025", v:10},
    {date:"22.03.2025", v:0},
    {date:"23.03.2025", v:0},
    {date:"24.03.2025", v:1},
    {date:"25.03.2025", v:0},
    {date:"26.03.2025", v:0},
    {date:"27.03.2025", v:5},
    {date:"28.03.2025", v:1},
    {date:"29.03.2025", v:0},
    {date:"30.03.2025", v:0},
    {date:"31.03.2025", v:2},
    {date:"01.04.2025", v:0},
    {date:"02.04.2025", v:0},
    {date:"03.04.2025", v:2},
    {date:"04.04.2025", v:11},
    {date:"05.04.2025", v:0},
    {date:"06.04.2025", v:0},
    {date:"07.04.2025", v:1},
    {date:"08.04.2025", v:0},
    {date:"09.04.2025", v:0},
    {date:"10.04.2025", v:5},
    {date:"11.04.2025", v:2},
    {date:"12.04.2025", v:0},
    {date:"13.04.2025", v:0},
    {date:"14.04.2025", v:1},
    {date:"15.04.2025", v:0},
    {date:"16.04.2025", v:0},
    {date:"17.04.2025", v:4},
    {date:"18.04.2025", v:7},
    {date:"19.04.2025", v:0},
  ];

  const n = raw.length;
  const vals = raw.map(r => r.v);
  const mean = vals.reduce((a, b) => a + b, 0) / n;
  const sorted = [...vals].sort((a, b) => a - b);
  const median = n % 2 === 0
    ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2
    : sorted[Math.floor(n / 2)];
  const p85 = sorted[Math.round(0.85 * n) - 1];
  const min = sorted[0];
  const max = sorted[n - 1];

  // Moving ranges
  const mrs = [];
  for (let i = 1; i < n; i++) mrs.push(Math.abs(vals[i] - vals[i - 1]));
  const mrMean = mrs.reduce((a, b) => a + b, 0) / mrs.length;

  // X-chart control limits
  const unpl = mean + 2.66 * mrMean;
  const lnpl = Math.max(0, mean - 2.66 * mrMean);

  // MR-chart control limits
  const url = 3.27 * mrMean;
  const lrl = 0;

  // Stats cards
  const stats = [
    {label: "Liczba dni",    value: n,                unit: ""},
    {label: "Średnia (X̄)",  value: mean.toFixed(2),  unit: "zad/dzień"},
    {label: "Mediana",       value: median,            unit: "zad/dzień"},
    {label: "85. percentyl", value: p85,               unit: "zad/dzień"},
    {label: "Śr. zakres MR̄", value: mrMean.toFixed(2), unit: ""},
    {label: "UNPL",          value: unpl.toFixed(2),  unit: "zad/dzień"},
    {label: "LNPL",          value: lnpl.toFixed(2),  unit: "zad/dzień"},
    {label: "URL (MR)",      value: url.toFixed(2),   unit: ""},
    {label: "Min",           value: min,              unit: "zad/dzień"},
    {label: "Max",           value: max,              unit: "zad/dzień"},
  ];
  const row = document.getElementById('statsRow');
  stats.forEach(s => {
    row.innerHTML += `
      <div class="stat-card">
        <div class="label">${s.label}</div>
        <div class="value">${s.value}<span class="unit">${s.unit}</span></div>
      </div>`;
  });

  Chart.register(window['chartjs-plugin-annotation']);

  // ── X chart ──────────────────────────────────────────────────────────────
  const xLabels = raw.map(r => r.date);

  new Chart(document.getElementById('runChart'), {
    type: 'line',
    data: {
      labels: xLabels,
      datasets: [
        {
          label: 'Przepustowość',
          data: vals,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.12)',
          borderWidth: 2,
          pointRadius: 5,
          pointBackgroundColor: vals.map(v => v > median ? '#3b82f6' : '#93c5fd'),
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0.3,
          fill: false,
          order: 1,
        },
        {
          label: 'Mediana',
          data: Array(n).fill(median),
          borderColor: '#f59e0b',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 2,
        },
        {
          label: 'Średnia (X̄)',
          data: Array(n).fill(mean),
          borderColor: '#10b981',
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
          order: 3,
        },
        {
          label: 'UNPL',
          data: Array(n).fill(unpl),
          borderColor: '#ef4444',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 4,
        },
        {
          label: 'LNPL',
          data: Array(n).fill(lnpl),
          borderColor: '#ef4444',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 5,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return `Data: ${raw[i].date}`;
            },
            label: (item) => {
              if (item.datasetIndex === 0) return ` Przepustowość: ${item.raw} zad/dzień`;
              if (item.datasetIndex === 1) return ` Mediana: ${item.raw} zad/dzień`;
              if (item.datasetIndex === 2) return ` Średnia (X̄): ${item.raw.toFixed(2)} zad/dzień`;
              if (item.datasetIndex === 3) return ` UNPL: ${item.raw.toFixed(2)} zad/dzień`;
              if (item.datasetIndex === 4) return ` LNPL: ${item.raw.toFixed(2)} zad/dzień`;
              return ` ${item.dataset.label}: ${item.raw}`;
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Data', font: { size: 12 }, color: '#666' },
          ticks: { color: '#666', maxRotation: 60, autoSkip: true, maxTicksLimit: 20 },
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        y: {
          title: { display: true, text: 'Przepustowość (zadań/dzień)', font: { size: 12 }, color: '#666' },
          ticks: { color: '#666' },
          grid: { color: 'rgba(0,0,0,0.07)' },
          min: 0,
        }
      }
    }
  });

  // ── MR chart ─────────────────────────────────────────────────────────────
  const mrLabels = raw.slice(1).map(r => r.date);

  new Chart(document.getElementById('mrChart'), {
    type: 'line',
    data: {
      labels: mrLabels,
      datasets: [
        {
          label: 'Zakres kroczący (MR)',
          data: mrs,
          borderColor: '#8b5cf6',
          backgroundColor: 'rgba(139,92,246,0.10)',
          borderWidth: 2,
          pointRadius: 5,
          pointBackgroundColor: mrs.map(v => v > url ? '#ef4444' : '#8b5cf6'),
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0.3,
          fill: false,
          order: 1,
        },
        {
          label: 'Średnia MR̄',
          data: Array(mrs.length).fill(mrMean),
          borderColor: '#10b981',
          borderWidth: 2,
          pointRadius: 0,
          fill: false,
          order: 2,
        },
        {
          label: 'URL',
          data: Array(mrs.length).fill(url),
          borderColor: '#ef4444',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 3,
        },
        {
          label: 'LRL',
          data: Array(mrs.length).fill(lrl),
          borderColor: '#f59e0b',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 4,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return `Data: ${mrLabels[i]}`;
            },
            label: (item) => {
              if (item.datasetIndex === 0) return ` MR: ${item.raw.toFixed(2)}`;
              if (item.datasetIndex === 1) return ` Średnia MR̄: ${item.raw.toFixed(2)}`;
              if (item.datasetIndex === 2) return ` URL: ${item.raw.toFixed(2)}`;
              if (item.datasetIndex === 3) return ` LRL: ${item.raw.toFixed(2)}`;
              return ` ${item.dataset.label}: ${item.raw}`;
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Data', font: { size: 12 }, color: '#666' },
          ticks: { color: '#666', maxRotation: 60, autoSkip: true, maxTicksLimit: 20 },
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        y: {
          title: { display: true, text: 'Zakres kroczący', font: { size: 12 }, color: '#666' },
          ticks: { color: '#666' },
          grid: { color: 'rgba(0,0,0,0.07)' },
          min: 0,
        }
      }
    }
  });
</script>
</body>
</html>
