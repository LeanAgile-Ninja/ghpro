<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histogram Czasów Realizacji</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6fb;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1a202c;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 28px;
    }

    .dashboard {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 28px 32px;
      width: 100%;
      max-width: 960px;
    }

    .chart-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .chart-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      height: 380px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 180px;
    }

    /* Size Legend */
    .legend-box, .controls-box {
      background: #f8f9fc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .legend-box h3, .controls-box h3 {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a0aec0;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: #4a5568;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Percentile controls */
    .pctl-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 0.86rem;
      color: #4a5568;
      cursor: pointer;
      user-select: none;
    }

    .pctl-item input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .pctl-item input[type="checkbox"]:checked {
      background: var(--color);
    }

    .pctl-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 11px;
      line-height: 1;
      top: 1px;
      left: 2px;
    }

    .pctl-dash {
      display: inline-block;
      width: 20px;
      height: 3px;
      border-radius: 2px;
      background: var(--color);
      flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .stat-card {
      background: #f8f9fc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a0aec0;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2d3748;
      margin-top: 2px;
    }

    .stat-unit {
      font-size: 0.72rem;
      color: #a0aec0;
      margin-top: 1px;
    }

    /* Filter radio buttons */
    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: #4a5568;
      cursor: pointer;
      user-select: none;
    }

    .radio-item input[type="radio"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e0;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .radio-item input[type="radio"]:checked {
      border-color: #3b82f6;
      background: #3b82f6;
    }

    .radio-item input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
    }

    /* Add entry form */
    .add-form-wrap {
      margin-top: 24px;
      background: #f8f9fc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px 20px;
    }

    .add-form-wrap h3 {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a0aec0;
      margin-bottom: 12px;
    }

    .add-form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-field label {
      font-size: 0.78rem;
      color: #718096;
      font-weight: 600;
    }

    .form-field select,
    .form-field input[type="number"] {
      border: 1px solid #cbd5e0;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 0.88rem;
      color: #2d3748;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-field select:focus,
    .form-field input[type="number"]:focus {
      border-color: #3b82f6;
    }

    .form-field input[type="number"] {
      width: 110px;
    }

    .btn-add {
      padding: 8px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      align-self: flex-end;
    }

    .btn-add:hover { background: #2563eb; }

    .add-feedback {
      font-size: 0.8rem;
      color: #10b981;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>Histogram Czasów Realizacji</h1>
  <p class="subtitle">Rozkład czasu realizacji zgłoszeń według rozmiaru (n = 36)</p>

  <div class="dashboard">
    <div class="chart-row">
      <div class="chart-wrap">
        <canvas id="histChart"></canvas>
      </div>
      <div class="sidebar">
        <div class="legend-box">
          <h3>Filtr rozmiaru</h3>
          <label class="radio-item">
            <input type="radio" name="sizeFilter" value="all" checked> Wszystkie
          </label>
          <label class="radio-item">
            <input type="radio" name="sizeFilter" value="S"> S – Small
          </label>
          <label class="radio-item">
            <input type="radio" name="sizeFilter" value="M"> M – Medium
          </label>
          <label class="radio-item">
            <input type="radio" name="sizeFilter" value="L"> L – Large
          </label>
        </div>

        <div class="controls-box">
          <h3>Statystyki</h3>

          <label class="pctl-item" style="--color:#6366f1;">
            <input type="checkbox" id="chk-mean" style="--color:#6366f1;" checked>
            <span class="pctl-dash" style="--color:#6366f1;"></span>Średnia
          </label>
          <label class="pctl-item" style="--color:#f43f5e;">
            <input type="checkbox" id="chk-p50" style="--color:#f43f5e;" checked>
            <span class="pctl-dash" style="--color:#f43f5e; border-top:2px dashed #f43f5e; height:0; background:transparent;"></span>P50 (Mediana)
          </label>
          <label class="pctl-item" style="--color:#f97316;">
            <input type="checkbox" id="chk-p85" style="--color:#f97316;" checked>
            <span class="pctl-dash" style="--color:#f97316; border-top:2px dashed #f97316; height:0; background:transparent;"></span>P85
          </label>
          <label class="pctl-item" style="--color:#8b5cf6;">
            <input type="checkbox" id="chk-p95" style="--color:#8b5cf6;" checked>
            <span class="pctl-dash" style="--color:#8b5cf6; border-top:2px dashed #8b5cf6; height:0; background:transparent;"></span>P95
          </label>
        </div>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="add-form-wrap">
      <h3>Dodaj czas realizacji</h3>
      <div class="add-form-row">
        <div class="form-field">
          <label for="newSize">Rozmiar</label>
          <select id="newSize">
            <option value="S">S – Small</option>
            <option value="M">M – Medium</option>
            <option value="L">L – Large</option>
          </select>
        </div>
        <div class="form-field">
          <label for="newDays">Czas (dni)</label>
          <input type="number" id="newDays" min="1" placeholder="np. 90">
        </div>
        <button class="btn-add" id="btnAdd">Dodaj</button>
      </div>
      <div class="add-feedback" id="addFeedback"></div>
    </div>
  </div>

  <script>
    // ── Raw data ──────────────────────────────────────────────────────────────
    let rawData = [
      {size:'S',days:49},{size:'S',days:48},{size:'S',days:87},{size:'M',days:57},
      {size:'M',days:148},{size:'S',days:53},{size:'S',days:45},{size:'M',days:145},
      {size:'L',days:105},{size:'S',days:5},{size:'L',days:163},{size:'S',days:43},
      {size:'M',days:415},{size:'L',days:123},{size:'M',days:103},{size:'L',days:104},
      {size:'L',days:302},{size:'L',days:158},{size:'L',days:98},{size:'S',days:52},
      {size:'M',days:95},{size:'S',days:70},{size:'M',days:95},{size:'M',days:101},
      {size:'M',days:57},{size:'M',days:57},{size:'S',days:53},{size:'L',days:137},
      {size:'S',days:73},{size:'M',days:60},{size:'S',days:126},{size:'M',days:57},
      {size:'L',days:124},{size:'M',days:75},{size:'M',days:89},{size:'S',days:44},
    ];

    // ── Stats helpers ─────────────────────────────────────────────────────────
    function pctValue(sorted, p) {
      const idx = (p / 100) * (sorted.length - 1);
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
    }

    // ── Constants ─────────────────────────────────────────────────────────────
    const BIN = 25;

    // Convert a day value to a fractional category-axis index
    function dayToX(val, numBins) {
      const bi = Math.min(Math.floor(val / BIN), numBins - 1);
      const frac = (val % BIN) / BIN;
      return bi + frac;
    }

    // ── State ─────────────────────────────────────────────────────────────────
    const visible = { mean: true, p50: true, p85: true, p95: true };
    let activeFilter = 'all'; // 'all' | 'S' | 'M' | 'L'

    // ── Compute bins from current rawData ─────────────────────────────────────
    function computeBins() {
      const maxDay = Math.max(...rawData.map(d => d.days));
      const numBins = Math.ceil((maxDay + 1) / BIN);
      const counts = {
        S: new Array(numBins).fill(0),
        M: new Array(numBins).fill(0),
        L: new Array(numBins).fill(0),
      };
      rawData.forEach(d => { counts[d.size][Math.floor(d.days / BIN)]++; });
      const labels = [];
      for (let i = 0; i < numBins; i++) labels.push(`${i * BIN}–${(i + 1) * BIN - 1}`);
      return { counts, labels, numBins };
    }

    // ── Build annotations ─────────────────────────────────────────────────────
    function buildAnnotations(filteredDays, numBins) {
      if (!filteredDays.length) return {};
      const mean = filteredDays.reduce((s, v) => s + v, 0) / filteredDays.length;
      const p50  = pctValue(filteredDays, 50);
      const p85  = pctValue(filteredDays, 85);
      const p95  = pctValue(filteredDays, 95);

      const defs = {
        mean: { value: mean, color: '#6366f1', label: `Średnia (${mean.toFixed(1)})`, dash: [6,0] },
        p50:  { value: p50,  color: '#f43f5e', label: `P50 (${p50.toFixed(1)})`,      dash: [6,3] },
        p85:  { value: p85,  color: '#f97316', label: `P85 (${p85.toFixed(1)})`,      dash: [6,3] },
        p95:  { value: p95,  color: '#8b5cf6', label: `P95 (${p95.toFixed(1)})`,      dash: [6,3] },
      };

      const obj = {};
      Object.entries(defs).forEach(([key, def]) => {
        if (!visible[key]) return;
        obj[key] = {
          type: 'line',
          xMin: dayToX(def.value, numBins),
          xMax: dayToX(def.value, numBins),
          borderColor: def.color,
          borderWidth: 2,
          borderDash: def.dash,
          label: {
            display: true,
            content: def.label,
            backgroundColor: def.color,
            color: '#fff',
            font: { size: 11, weight: 'bold' },
            padding: { x: 6, y: 3 },
            position: 'start',
            yAdjust: -6,
          }
        };
      });
      return obj;
    }

    // ── Chart setup (initial data) ────────────────────────────────────────────
    const ctx = document.getElementById('histChart').getContext('2d');
    const initBins = computeBins();

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: initBins.labels,
        datasets: [
          { label: 'S', data: initBins.counts.S, backgroundColor: '#3b82f6cc', borderColor: '#2563eb', borderWidth: 1 },
          { label: 'M', data: initBins.counts.M, backgroundColor: '#10b981cc', borderColor: '#059669', borderWidth: 1 },
          { label: 'L', data: initBins.counts.L, backgroundColor: '#f59e0bcc', borderColor: '#d97706', borderWidth: 1 },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => {
                const idx = items[0].dataIndex;
                return `Przedział: ${idx * BIN}–${(idx + 1) * BIN - 1} dni`;
              },
              afterBody: (items) => {
                const idx = items[0].dataIndex;
                const ds = chart.data.datasets;
                const total = ds.filter(d => !d.hidden).reduce((s, d) => s + (d.data[idx] || 0), 0);
                return [`Łącznie: ${total}`];
              }
            }
          },
          annotation: {
            annotations: buildAnnotations(
              rawData.map(d => d.days).sort((a, b) => a - b),
              initBins.numBins
            )
          }
        },
        scales: {
          x: {
            stacked: true,
            title: { display: true, text: 'Czas realizacji (dni)', font: { size: 12 }, color: '#718096' },
            grid: { color: '#f0f0f0' },
            ticks: { color: '#718096', font: { size: 11 } },
          },
          y: {
            stacked: true,
            title: { display: true, text: 'Liczba zgłoszeń', font: { size: 12 }, color: '#718096' },
            grid: { color: '#f0f0f0' },
            ticks: { color: '#718096', stepSize: 1 },
            beginAtZero: true,
          }
        }
      }
    });

    // ── Render: rebuild chart + stats from current rawData + activeFilter ─────
    function render() {
      const { counts, labels, numBins } = computeBins();

      chart.data.labels = labels;
      chart.data.datasets[0].data = counts.S;
      chart.data.datasets[1].data = counts.M;
      chart.data.datasets[2].data = counts.L;

      chart.data.datasets[0].hidden = activeFilter !== 'all' && activeFilter !== 'S';
      chart.data.datasets[1].hidden = activeFilter !== 'all' && activeFilter !== 'M';
      chart.data.datasets[2].hidden = activeFilter !== 'all' && activeFilter !== 'L';

      const filteredData = activeFilter === 'all' ? rawData : rawData.filter(d => d.size === activeFilter);
      const filteredDays = filteredData.map(d => d.days).sort((a, b) => a - b);

      chart.options.plugins.annotation.annotations = buildAnnotations(filteredDays, numBins);
      chart.update();

      // Stats grid
      const statsGrid = document.getElementById('statsGrid');
      statsGrid.innerHTML = '';
      if (filteredDays.length) {
        const mean = filteredDays.reduce((s, v) => s + v, 0) / filteredDays.length;
        const statsToShow = [
          { label: 'Średnia', value: mean,                    color: '#6366f1' },
          { label: 'P50',     value: pctValue(filteredDays, 50), color: '#f43f5e' },
          { label: 'P85',     value: pctValue(filteredDays, 85), color: '#f97316' },
          { label: 'P95',     value: pctValue(filteredDays, 95), color: '#8b5cf6' },
        ];
        statsToShow.forEach(s => {
          statsGrid.insertAdjacentHTML('beforeend', `
            <div class="stat-card">
              <div class="stat-label" style="color:${s.color}">${s.label}</div>
              <div class="stat-value">${Math.round(s.value)}</div>
              <div class="stat-unit">dni</div>
            </div>
          `);
        });
      }

      // Subtitle count
      document.querySelector('.subtitle').textContent =
        `Rozkład czasu realizacji zgłoszeń według rozmiaru (n = ${rawData.length})`;
    }

    // Initial render
    render();

    // ── Checkbox handlers ─────────────────────────────────────────────────────
    ['mean','p50','p85','p95'].forEach(key => {
      document.getElementById(`chk-${key}`).addEventListener('change', function() {
        visible[key] = this.checked;
        render();
      });
    });

    // ── Filter radio handlers ─────────────────────────────────────────────────
    document.querySelectorAll('input[name="sizeFilter"]').forEach(radio => {
      radio.addEventListener('change', function() {
        activeFilter = this.value;
        render();
      });
    });

    // ── Add entry handler ─────────────────────────────────────────────────────
    document.getElementById('btnAdd').addEventListener('click', () => {
      const size = document.getElementById('newSize').value;
      const days = parseInt(document.getElementById('newDays').value, 10);
      const feedback = document.getElementById('addFeedback');

      if (!days || days < 1) {
        feedback.style.color = '#f43f5e';
        feedback.textContent = 'Podaj prawidłowy czas (liczba dni ≥ 1).';
        return;
      }

      rawData.push({ size, days });
      document.getElementById('newDays').value = '';
      feedback.style.color = '#10b981';
      feedback.textContent = `Dodano: ${size} – ${days} dni`;
      setTimeout(() => { feedback.textContent = ''; }, 3000);
      render();
    });
  </script>
</body>
</html>
