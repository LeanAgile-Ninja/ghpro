<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCB – Wykres Przebiegu Czasów Realizacji</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a2940;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      min-width: 130px;
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a2940;
    }
    .stat-card .unit {
      font-size: 0.8rem;
      color: #888;
      margin-left: 3px;
    }
    .chart-card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .chart-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a2940;
    }
    .chart-container {
      position: relative;
      height: 360px;
    }
    .legend-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #555;
    }
    .legend-dot {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <h1>PCB – Wykres Przebiegu Czasów Realizacji</h1>
  <p class="subtitle">Dane posortowane według daty zamknięcia zadania</p>

  <div class="stats-row" id="statsRow"></div>

  <div class="chart-card">
    <h2>Wykres przebiegu</h2>
    <div class="chart-container">
      <canvas id="runChart"></canvas>
    </div>
    <div class="legend-row">
      <div class="legend-item">
        <div class="legend-dot" style="background:#3b82f6; height:3px;"></div>
        Czas realizacji
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#f59e0b; height:2px; border-top: 2px dashed #f59e0b; background:transparent;"></div>
        Mediana
      </div>
    </div>
  </div>

<script>
  const raw = [
    {id:1,  closed:"2024-01-05", ct:38},
    {id:2,  closed:"2024-01-11", ct:24},
    {id:3,  closed:"2024-01-16", ct:14},
    {id:4,  closed:"2024-01-17", ct:9},
    {id:5,  closed:"2024-01-22", ct:4},
    {id:6,  closed:"2024-01-26", ct:25},
    {id:7,  closed:"2024-01-29", ct:19},
    {id:8,  closed:"2024-02-06", ct:51},
    {id:9,  closed:"2024-02-12", ct:48},
    {id:10, closed:"2024-02-15", ct:15},
    {id:11, closed:"2024-02-17", ct:22},
    {id:12, closed:"2024-02-18", ct:42},
    {id:13, closed:"2024-02-19", ct:17},
    {id:14, closed:"2024-02-21", ct:7},
    {id:15, closed:"2024-02-28", ct:5},
    {id:16, closed:"2024-03-12", ct:20},
    {id:17, closed:"2024-03-14", ct:63},
    {id:18, closed:"2024-03-19", ct:6},
    {id:19, closed:"2024-03-20", ct:56},
    {id:20, closed:"2024-03-22", ct:24},
    {id:21, closed:"2024-03-22", ct:22},
    {id:22, closed:"2024-03-26", ct:50},
    {id:23, closed:"2024-03-27", ct:8},
    {id:24, closed:"2024-03-28", ct:2},
    {id:25, closed:"2024-03-29", ct:3},
    {id:26, closed:"2024-03-30", ct:8},
    {id:27, closed:"2024-04-01", ct:36},
    {id:28, closed:"2024-04-02", ct:27},
    {id:29, closed:"2024-04-09", ct:29},
    {id:30, closed:"2024-04-09", ct:20},
  ];

  const n = raw.length;
  const cts = raw.map(r => r.ct);
  const mean = cts.reduce((a,b) => a+b, 0) / n;
  const sorted = [...cts].sort((a,b) => a-b);
  const median = n % 2 === 0
    ? (sorted[n/2 - 1] + sorted[n/2]) / 2
    : sorted[Math.floor(n/2)];
  const p85 = sorted[Math.round(0.85 * n) - 1];
  const min = sorted[0];
  const max = sorted[n - 1];

  // Stats cards
  const stats = [
    {label: "Liczba zadań", value: n, unit: ""},
    {label: "Średnia", value: mean.toFixed(1), unit: "dni"},
    {label: "Mediana", value: median, unit: "dni"},
    {label: "85. percentyl", value: p85, unit: "dni"},
    {label: "Min", value: min, unit: "dni"},
    {label: "Max", value: max, unit: "dni"},
  ];
  const row = document.getElementById('statsRow');
  stats.forEach(s => {
    row.innerHTML += `
      <div class="stat-card">
        <div class="label">${s.label}</div>
        <div class="value">${s.value}<span class="unit">${s.unit}</span></div>
      </div>`;
  });

  // Chart
  const labels = raw.map(r => r.id);
  const tooltipDates = raw.map(r => r.closed);

  Chart.register(ChartDataLabels = window['chartjs-plugin-annotation']);

  new Chart(document.getElementById('runChart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Czas realizacji',
          data: cts,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.12)',
          borderWidth: 2,
          pointRadius: 5,
          pointBackgroundColor: cts.map(v => v > median ? '#3b82f6' : '#93c5fd'),
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0.3,
          fill: false,
          order: 1,
        },
        {
          label: 'Mediana',
          data: Array(n).fill(median),
          borderColor: '#f59e0b',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 2,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return `Zadanie #${raw[i].id}  (${tooltipDates[i]})`;
            },
            label: (item) => {
              if (item.datasetIndex === 0) return ` Czas realizacji: ${item.raw} dni`;
              return ` Mediana: ${item.raw} dni`;
            }
          }
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Numer zadania (kolejność zamknięcia)',
            font: { size: 12 },
            color: '#666'
          },
          ticks: { color: '#666' },
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        y: {
          title: {
            display: true,
            text: 'Czas realizacji (dni)',
            font: { size: 12 },
            color: '#666'
          },
          ticks: { color: '#666' },
          grid: { color: 'rgba(0,0,0,0.07)' },
          min: 0,
        }
      }
    }
  });
</script>
</body>
</html>
