<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widok Kalendarza 2026 – Przepustowość Dzienna</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6fb;
      color: #2d3748;
      min-height: 100vh;
      padding: 32px 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1a202c;
      letter-spacing: -0.3px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 28px;
      text-align: center;
    }

    .dashboard {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 28px 32px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Stats row ─────────────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #f8f9fc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 22px;
      min-width: 140px;
    }

    .stat-card .label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #a0aec0;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
    }

    .stat-card .unit {
      font-size: 0.8rem;
      color: #718096;
      margin-left: 3px;
    }

    /* ── Legend ────────────────────────────────────────────────────────── */
    .legend-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .legend-strip .legend-label {
      font-size: 0.78rem;
      color: #718096;
    }

    .legend-strip .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-block;
    }

    /* ── Calendar grid ─────────────────────────────────────────────────── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    @media (max-width: 900px) {
      .calendar-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 640px) {
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
      .dashboard { padding: 16px; }
    }

    @media (max-width: 380px) {
      .calendar-grid { grid-template-columns: 1fr; }
    }

    .month-block {
      background: #f8f9fc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
    }

    .month-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 3px;
    }

    .day-header {
      font-size: 0.65rem;
      font-weight: 600;
      color: #a0aec0;
      text-align: center;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .day-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 3px;
      cursor: default;
      position: relative;
      transition: transform 0.1s;
    }

    .day-cell:not(.empty):hover {
      transform: scale(1.15);
      z-index: 10;
    }

    .day-cell.empty {
      background: transparent;
    }

    /* ── Tooltip ───────────────────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: #1a202c;
      color: #fff;
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 9999;
      white-space: nowrap;
    }

    #tooltip.visible { opacity: 1; }

    /* ── Loading/Error state ───────────────────────────────────────────── */
    #loadMsg {
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <h1>Widok Kalendarza 2026</h1>
  <p class="subtitle">Przepustowość dzienna · źródło: 4. Tempo dostarczania dzienne.csv</p>

  <div class="dashboard">
    <div class="stats-row" id="statsRow">
      <p id="loadMsg">Wczytywanie danych…</p>
    </div>

    <div class="legend-strip" id="legendStrip" style="display:none"></div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div id="tooltip"></div>

<script>
  /* ── Colour scale ──────────────────────────────────────────────────── */
  const LEVELS = [
    { max: 0,   color: '#edf2f7', label: '0'    },
    { max: 2,   color: '#bee3f8', label: '1–2'  },
    { max: 5,   color: '#63b3ed', label: '3–5'  },
    { max: 9,   color: '#3182ce', label: '6–9'  },
    { max: Infinity, color: '#1a365d', label: '10+' }
  ];

  function colorFor(v) {
    for (const l of LEVELS) if (v <= l.max) return l.color;
    return LEVELS[LEVELS.length - 1].color;
  }

  /* ── Polish month names ────────────────────────────────────────────── */
  const MONTHS_PL = [
    'Styczeń','Luty','Marzec','Kwiecień',
    'Maj','Czerwiec','Lipiec','Sierpień',
    'Wrzesień','Październik','Listopad','Grudzień'
  ];

  /* Day-of-week headers: Mon → Sun (0=Mon…6=Sun) */
  const DAY_HEADERS = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];

  /* ── Parse CSV ─────────────────────────────────────────────────────── */
  function parseCSV(text) {
    const map = {};
    const lines = text.split(/\r?\n/).slice(1); // skip header
    for (const line of lines) {
      const parts = line.trim().split(';');
      if (parts.length < 2) continue;
      const dateStr = parts[0].trim();   // DD.MM.YYYY
      const val = parseInt(parts[1], 10);
      if (!dateStr || isNaN(val)) continue;
      const [dd, mm, yyyy] = dateStr.split('.');
      if (!dd || !mm || !yyyy) continue;
      // normalise to YYYY-MM-DD key
      const key = `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
      map[key] = (map[key] || 0) + val;
    }
    return map;
  }

  /* ── Build calendar ────────────────────────────────────────────────── */
  function buildCalendar(dataMap) {
    const params = new URLSearchParams(window.location.search);
    const YEAR = parseInt(params.get('year'), 10) || 2026;

    /* update page heading with actual year */
    document.title = `Widok Kalendarza ${YEAR} – Przepustowość Dzienna`;
    document.querySelector('h1').textContent = `Widok Kalendarza ${YEAR}`;

    /* compute stats for selected year only */
    const yearStr = String(YEAR);
    let total = 0, activeDays = 0;
    for (const [key, v] of Object.entries(dataMap)) {
      if (!key.startsWith(yearStr)) continue;
      if (v > 0) { total += v; activeDays++; }
    }
    const avgActive = activeDays > 0 ? (total / activeDays).toFixed(1) : '–';

    /* render stats */
    document.getElementById('loadMsg').remove();
    const statsRow = document.getElementById('statsRow');
    const statsData = [
      { label: `Łącznie (${YEAR})`, value: total,      unit: 'szt.' },
      { label: 'Aktywne dni',    value: activeDays,  unit: 'dni' },
      { label: 'Śr./aktywny dzień', value: avgActive, unit: 'szt.' },
    ];
    for (const s of statsData) {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<div class="label">${s.label}</div>
        <div class="value">${s.value}<span class="unit">${s.unit}</span></div>`;
      statsRow.appendChild(card);
    }

    /* render legend */
    const legendStrip = document.getElementById('legendStrip');
    legendStrip.style.display = 'flex';
    const lessLabel = document.createElement('span');
    lessLabel.className = 'legend-label';
    lessLabel.textContent = 'Mniej';
    legendStrip.appendChild(lessLabel);
    for (const l of LEVELS) {
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = l.color;
      sw.title = l.label;
      legendStrip.appendChild(sw);
    }
    const moreLabel = document.createElement('span');
    moreLabel.className = 'legend-label';
    moreLabel.textContent = 'Więcej';
    legendStrip.appendChild(moreLabel);

    /* render months */
    const grid = document.getElementById('calendarGrid');
    for (let m = 0; m < 12; m++) {
      const block = document.createElement('div');
      block.className = 'month-block';

      const title = document.createElement('div');
      title.className = 'month-name';
      title.textContent = MONTHS_PL[m];
      block.appendChild(title);

      /* day-of-week headers */
      const hdrs = document.createElement('div');
      hdrs.className = 'day-headers';
      for (const h of DAY_HEADERS) {
        const dh = document.createElement('div');
        dh.className = 'day-header';
        dh.textContent = h;
        hdrs.appendChild(dh);
      }
      block.appendChild(hdrs);

      /* day cells */
      const daysGrid = document.createElement('div');
      daysGrid.className = 'days-grid';

      /* first day of month: JS getDay() 0=Sun…6=Sat → convert to Mon=0 */
      const firstDate = new Date(YEAR, m, 1);
      const firstDow = (firstDate.getDay() + 6) % 7; // Mon-based
      const daysInMonth = new Date(YEAR, m + 1, 0).getDate();

      /* empty cells before the 1st */
      for (let e = 0; e < firstDow; e++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        daysGrid.appendChild(empty);
      }

      /* actual day cells */
      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(m + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        const key = `${YEAR}-${mm}-${dd}`;
        const v = dataMap[key] ?? 0;

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.style.background = colorFor(v);
        cell.dataset.date = `${dd}.${mm}.${YEAR}`;
        cell.dataset.val = v;
        daysGrid.appendChild(cell);
      }

      block.appendChild(daysGrid);
      grid.appendChild(block);
    }
  }

  /* ── Tooltip logic ─────────────────────────────────────────────────── */
  const tooltip = document.getElementById('tooltip');

  document.addEventListener('mousemove', e => {
    const cell = e.target.closest('.day-cell:not(.empty)');
    if (!cell) { tooltip.classList.remove('visible'); return; }
    const v = cell.dataset.val;
    const d = cell.dataset.date;
    tooltip.textContent = `${d}: ${v} szt.`;
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 28) + 'px';
    tooltip.classList.add('visible');
  });

  document.addEventListener('mouseleave', () => tooltip.classList.remove('visible'), true);

  /* ── Fetch & initialise ────────────────────────────────────────────── */
  fetch('4. Tempo dostarczania dzienne.csv')
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.text();
    })
    .then(text => {
      const dataMap = parseCSV(text);
      buildCalendar(dataMap);
    })
    .catch(err => {
      document.getElementById('loadMsg').textContent =
        `Błąd ładowania danych: ${err.message}. Upewnij się, że plik CSV jest dostępny.`;
    });
</script>
</body>
</html>
